# Allow lines to be as long as 120.
line-length = 320
# Migrations and protobuf modules are generated.
extend-exclude = ["web/nspanelmanager/web/migrations", "web/nspanelmanager/web/protobuf"]

[lint]
# Ruff's long-standing defaults, listed explicitly so that a newer ruff
# doesn't enable more rules on its own.
select = ["E4", "E7", "E9", "F"]
# Avoid enforcing line-length violations (`E501`)
ignore = ["E501"]

[format]
# Use double quotes when formatting.
quote-style = "double"

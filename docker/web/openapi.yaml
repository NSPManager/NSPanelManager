openapi: 3.0.3
info:
  title: NSPanelManager REST API
  version: '2'
  description: The /rest/v2/* API used by the web UI. Generated by drf-spectacular;
    see docker/web/generate_api.sh.
paths:
  /rest/v2/settings:
    get:
      operationId: settings_retrieve
      tags:
      - settings
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
    patch:
      operationId: settings_partial_update
      tags:
      - settings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSettingsUpdateRequest'
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsErrors'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '415':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
components:
  schemas:
    BlankEnum:
      enum:
      - ''
    DefaultNspanelTypeEnum:
      enum:
      - eu
      - us
      type: string
      description: |-
        * `eu` - eu
        * `us` - us
    Detail:
      type: object
      description: DRF's error body for a request it rejects before validation, e.g.
        invalid JSON or a failed CSRF check.
      properties:
        detail:
          type: string
      required:
      - detail
    MqttmanagerLogLevelEnum:
      enum:
      - error
      - warning
      - info
      - debug
      - trace
      type: string
      description: |-
        * `error` - error
        * `warning` - warning
        * `info` - info
        * `debug` - debug
        * `trace` - trace
    NullEnum:
      enum:
      - null
    OutsideTempSensorProviderEnum:
      enum:
      - home_assistant
      - openhab
      type: string
      description: |-
        * `home_assistant` - home_assistant
        * `openhab` - openhab
    PatchedSettingsUpdateRequest:
      type: object
      description: A PATCH /rest/v2/settings body. Send only the settings that change.
      properties:
        manager_address:
          type: string
          maxLength: 255
        manager_port:
          type: integer
          maximum: 65535
          minimum: 1
          nullable: true
          description: null (stored blank) until set.
        mqttmanager_log_level:
          $ref: '#/components/schemas/MqttmanagerLogLevelEnum'
        max_live_log_messages:
          type: integer
          maximum: 2147483647
          minimum: 0
        max_log_buffer_size:
          type: integer
          maximum: 2147483647
          minimum: 0
        default_nspanel_type:
          $ref: '#/components/schemas/DefaultNspanelTypeEnum'
        color_temp_min:
          type: integer
          maximum: 2147483647
          minimum: 1
        color_temp_max:
          type: integer
          maximum: 2147483647
          minimum: 1
        reverse_color_temp:
          type: boolean
        turn_on_behavior:
          $ref: '#/components/schemas/TurnOnBehaviorEnum'
        raise_to_100_light_level:
          type: integer
          maximum: 100
          minimum: 0
        light_turn_on_brightness:
          type: integer
          maximum: 100
          minimum: 1
        min_button_push_time:
          type: integer
          maximum: 2147483647
          minimum: 0
        button_long_press_time:
          type: integer
          maximum: 2147483647
          minimum: 0
        special_mode_trigger_time:
          type: integer
          maximum: 2147483647
          minimum: 0
        special_mode_release_time:
          type: integer
          maximum: 2147483647
          minimum: 0
        optimistic_mode:
          type: boolean
        room_status_backoff_time:
          type: integer
          maximum: 2147483647
          minimum: 0
        all_rooms_status_backoff_time:
          type: integer
          maximum: 2147483647
          minimum: 0
        mqtt_wait_time:
          type: integer
          maximum: 2147483647
          minimum: 0
        screen_dim_level:
          type: integer
          maximum: 100
          minimum: 1
        screensaver_dim_level:
          type: integer
          maximum: 100
          minimum: 0
        screensaver_activation_timeout:
          type: integer
          maximum: 2147483647
          minimum: 0
        screensaver_mode:
          $ref: '#/components/schemas/ScreensaverModeEnum'
        show_screensaver_inside_temperature:
          type: boolean
        show_screensaver_outside_temperature:
          type: boolean
        location_latitude:
          type: string
          maxLength: 255
        location_longitude:
          type: string
          maxLength: 255
        weather_update_interval:
          type: integer
          maximum: 2147483647
          minimum: 1
          description: Minutes between weather updates.
        weather_wind_speed_format:
          $ref: '#/components/schemas/WeatherWindSpeedFormatEnum'
        weather_precipitation_format:
          $ref: '#/components/schemas/WeatherPrecipitationFormatEnum'
        outside_temp_sensor_provider:
          description: |-
            Blank for no sensor.

            * `home_assistant` - home_assistant
            * `openhab` - openhab
          oneOf:
          - $ref: '#/components/schemas/OutsideTempSensorProviderEnum'
          - $ref: '#/components/schemas/BlankEnum'
        outside_temp_sensor_entity_id:
          type: string
          maxLength: 255
        date_format:
          type: string
          minLength: 1
          description: strftime() format.
          maxLength: 255
        clock_us_style:
          type: boolean
        use_fahrenheit:
          type: boolean
        theme:
          type: string
          minLength: 1
          maxLength: 255
        buzzer_sound_touch:
          type: string
          maxLength: 255
        buzzer_sound_scene_activated:
          type: string
          maxLength: 255
        buzzer_sound_scene_saved:
          type: string
          maxLength: 255
        mqtt_server:
          type: string
          maxLength: 255
        mqtt_port:
          type: integer
          maximum: 65535
          minimum: 1
        mqtt_username:
          type: string
          maxLength: 255
        mqtt_password:
          type: string
          writeOnly: true
          description: Blank clears the password.
          maxLength: 255
        home_assistant_address:
          type: string
          description: A trailing / is removed.
          maxLength: 255
        home_assistant_token:
          type: string
          writeOnly: true
          description: Blank clears the token.
          maxLength: 255
        openhab_address:
          type: string
          description: A trailing / is removed.
          maxLength: 255
        openhab_token:
          type: string
          writeOnly: true
          description: Blank clears the token.
          maxLength: 255
        openhab_brightness_channel_min:
          type: integer
          maximum: 255
          minimum: 0
        openhab_brightness_channel_max:
          type: integer
          maximum: 255
          minimum: 0
    ScreensaverModeEnum:
      enum:
      - with_background
      - without_background
      - datetime_with_background
      - datetime_without_background
      - no_screensaver
      type: string
      description: |-
        * `with_background` - with_background
        * `without_background` - without_background
        * `datetime_with_background` - datetime_with_background
        * `datetime_without_background` - datetime_without_background
        * `no_screensaver` - no_screensaver
    Settings:
      type: object
      description: The global settings. Secrets are never returned, only whether each
        is set.
      properties:
        manager_address:
          type: string
          nullable: true
        manager_port:
          type: integer
          nullable: true
        mqttmanager_log_level:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/MqttmanagerLogLevelEnum'
          - $ref: '#/components/schemas/NullEnum'
        max_live_log_messages:
          type: integer
          nullable: true
        max_log_buffer_size:
          type: integer
          nullable: true
        default_nspanel_type:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/DefaultNspanelTypeEnum'
          - $ref: '#/components/schemas/NullEnum'
        color_temp_min:
          type: integer
          nullable: true
        color_temp_max:
          type: integer
          nullable: true
        reverse_color_temp:
          type: boolean
          nullable: true
        turn_on_behavior:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/TurnOnBehaviorEnum'
          - $ref: '#/components/schemas/NullEnum'
        raise_to_100_light_level:
          type: integer
          nullable: true
        light_turn_on_brightness:
          type: integer
          nullable: true
        min_button_push_time:
          type: integer
          nullable: true
        button_long_press_time:
          type: integer
          nullable: true
        special_mode_trigger_time:
          type: integer
          nullable: true
        special_mode_release_time:
          type: integer
          nullable: true
        optimistic_mode:
          type: boolean
          nullable: true
        room_status_backoff_time:
          type: integer
          nullable: true
        all_rooms_status_backoff_time:
          type: integer
          nullable: true
        mqtt_wait_time:
          type: integer
          nullable: true
        screen_dim_level:
          type: integer
          nullable: true
        screensaver_dim_level:
          type: integer
          nullable: true
        screensaver_activation_timeout:
          type: integer
          nullable: true
        screensaver_mode:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/ScreensaverModeEnum'
          - $ref: '#/components/schemas/NullEnum'
        show_screensaver_inside_temperature:
          type: boolean
          nullable: true
        show_screensaver_outside_temperature:
          type: boolean
          nullable: true
        location_latitude:
          type: string
          nullable: true
        location_longitude:
          type: string
          nullable: true
        weather_update_interval:
          type: integer
          nullable: true
        weather_wind_speed_format:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/WeatherWindSpeedFormatEnum'
          - $ref: '#/components/schemas/NullEnum'
        weather_precipitation_format:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/WeatherPrecipitationFormatEnum'
          - $ref: '#/components/schemas/NullEnum'
        outside_temp_sensor_provider:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/OutsideTempSensorProviderEnum'
          - $ref: '#/components/schemas/BlankEnum'
          - $ref: '#/components/schemas/NullEnum'
        outside_temp_sensor_entity_id:
          type: string
          nullable: true
        date_format:
          type: string
          nullable: true
        clock_us_style:
          type: boolean
          nullable: true
        use_fahrenheit:
          type: boolean
          nullable: true
        theme:
          type: string
          nullable: true
        buzzer_sound_touch:
          type: string
          nullable: true
        buzzer_sound_scene_activated:
          type: string
          nullable: true
        buzzer_sound_scene_saved:
          type: string
          nullable: true
        mqtt_server:
          type: string
          nullable: true
        mqtt_port:
          type: integer
          nullable: true
        mqtt_username:
          type: string
          nullable: true
        mqtt_password_set:
          type: boolean
          description: Whether mqtt_password is set.
        home_assistant_address:
          type: string
          nullable: true
        home_assistant_token_set:
          type: boolean
          description: Whether home_assistant_token is set.
        openhab_address:
          type: string
          nullable: true
        openhab_token_set:
          type: boolean
          description: Whether openhab_token is set.
        openhab_brightness_channel_min:
          type: integer
          nullable: true
        openhab_brightness_channel_max:
          type: integer
          nullable: true
        is_home_assistant_addon:
          type: boolean
          description: Running as the Home Assistant add-on; home_assistant_* are
            read-only.
      required:
      - all_rooms_status_backoff_time
      - button_long_press_time
      - buzzer_sound_scene_activated
      - buzzer_sound_scene_saved

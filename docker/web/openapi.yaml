openapi: 3.0.3
info:
  title: NSPanelManager REST API
  version: '1'
  description: The /rest/* API used by the web UI. Generated by drf-spectacular; see
    docker/web/generate_api.sh.
paths:
  /rest/rooms:
    get:
      operationId: rooms_retrieve
      parameters:
      - in: query
        name: id
        schema:
          type: integer
        description: Only return this room.
      tags:
      - rooms
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomListResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    post:
      operationId: rooms_create
      tags:
      - rooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomCreateRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomIdResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
    put:
      operationId: rooms_update
      tags:
      - rooms
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoomUpdateRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomIdResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /rest/rooms/{room_id}:
    delete:
      operationId: rooms_destroy
      parameters:
      - in: path
        name: room_id
        schema:
          type: integer
        required: true
      tags:
      - rooms
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomIdResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    ErrorResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ErrorStatusEnum'
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          description: Validation errors by field name.
      required:
      - message
      - status
    ErrorStatusEnum:
      enum:
      - error
      type: string
      description: '* `error` - error'
    OkStatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    Room:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        friendly_name:
          type: string
          maxLength: 30
        display_order:
          type: integer
        room_temp_provider:
          type: string
          maxLength: 255
        room_temp_sensor:
          type: string
          maxLength: 255
      required:
      - display_order
      - friendly_name
      - id
      - room_temp_provider
      - room_temp_sensor
    RoomCreateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
      required:
      - name
    RoomIdResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OkStatusEnum'
        room_id:
          type: integer
      required:
      - room_id
      - status
    RoomListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/OkStatusEnum'
        rooms:
          type: array
          items:
            $ref: '#/components/schemas/Room'
      required:
      - rooms
      - status
    RoomUpdateRequest:
      type: object
      description: 'PUT /rest/rooms: the room''s id, plus only the fields to change.'
      properties:
        id:
          type: integer
        friendly_name:
          type: string
          minLength: 1
          maxLength: 30
        display_order:
          type: integer
        room_temp_provider:
          type: string
          maxLength: 255
        room_temp_sensor:
          type: string
          maxLength: 255
      required:
      - id

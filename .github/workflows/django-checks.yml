name: "Django checks"

on:
  pull_request:
    paths:
      - "docker/web/**"
      - "docker/ruff.toml"
      - ".github/workflows/django-checks.yml"
  push:
    branches:
      - "main"
      - "devel"
    paths:
      - "docker/web/**"
      - "docker/ruff.toml"
      - ".github/workflows/django-checks.yml"

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Pinned: ruff's default rules and its findings change between releases.
      - name: Install ruff
        run: pip install ruff==0.16.10

      # Only undefined names and syntax errors fail the build for now. The rest of
      # docker/ruff.toml's rules still report findings (unused imports and the like)
      # that need a cleanup pass before they can be enforced.
      - name: Check for undefined names and syntax errors
        working-directory: docker
        run: ruff check web/ --select F821,E9 --output-format github
